  sign-name: 阿里云短信测试
  access-key-id: REDACTED_CREDENTIAL
  access-key-secret: REDACTED_CREDENTIAL

#线程池
async:
  executor:
    thread:
      core_pool_size: 10
      max_pool_size: 20
      queue_capacity: 20
      name:
        prefix: async-service-


